<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · 这个页面不存在</title>
<style>
  :root { --bg:#f5f7fa; --fg:#0f172a; --dim:#64748b; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .card { max-width:460px; width:100%; text-align:center; }
  .num { font-size:96px; font-weight:800; line-height:1; letter-spacing:-4px; color:var(--accent); opacity:.9; }
  h1 { font-size:20px; margin:18px 0 10px; }
  p { color:var(--dim); font-size:14px; line-height:1.7; margin:0 0 26px; }
  a.btn {
    display:inline-block; padding:12px 26px; border-radius:10px; background:var(--accent);
    color:#fff; text-decoration:none; font-size:15px; font-weight:600;
    box-shadow:0 6px 18px rgba(37,99,235,.26); transition:transform .15s, box-shadow .15s;
  }
  a.btn:hover { transform:translateY(-1px); box-shadow:0 10px 24px rgba(37,99,235,.32); }
  .links { margin-top:26px; font-size:13px; color:var(--dim); }
  .links a { color:var(--dim); text-decoration:none; border-bottom:1px solid rgba(0,0,0,.14); }
  .links a:hover { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="num">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能写错了，或者页面已经挪走。<br>回到首页就能继续看盘。</p>
    <a class="btn" href="./">回到首页</a>
    <div class="links">
      <a href="https://github.com/aq18270592902-cloud/jczq-predict">看源码</a>
      &nbsp;·&nbsp;
      <a href="https://aq18270592902-cloud.github.io/">全部项目</a>
    </div>
  </div>
</body>
</html>
