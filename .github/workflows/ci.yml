name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 语法检查 + 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          for f in boot.js app.js server.js fetch_official.js data.js sw.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: PWA 资源完整
        run: |
          node -e '
            const fs = require("fs");
            const idx = fs.readFileSync("index.html", "utf8");
            const must = [
              ["manifest.webmanifest", "PWA 清单"],
              ["sw.js", "Service Worker"],
              ["icons/icon-192.png", "192 图标"],
              ["icons/icon-512.png", "512 图标"],
              ["icons/icon-180.png", "iOS 图标"]
            ];
            let bad = 0;
            for (const [f, label] of must) {
              if (!fs.existsSync(f)) { console.error("FAIL: 缺 " + f + "（" + label + "）"); bad++; }
            }
            if (!/rel="manifest"/.test(idx)) { console.error("FAIL: index.html 没有 rel=manifest"); bad++; }
            if (!/serviceWorker/.test(idx)) { console.error("FAIL: index.html 没有注册 Service Worker"); bad++; }
            const mf = JSON.parse(fs.readFileSync("manifest.webmanifest", "utf8"));
            if (!mf.name || !mf.start_url || !Array.isArray(mf.icons) || mf.icons.length < 2) {
              console.error("FAIL: manifest 字段不全（name/start_url/icons≥2）"); bad++;
            }
            const sw = fs.readFileSync("sw.js", "utf8");
            if (!/CACHE\s*=\s*"/.test(sw)) { console.error("FAIL: sw.js 没有 CACHE 版本号"); bad++; }

            /* 实时层契约：index.html 只能引 boot.js（它负责串行加载 data.js → 实时合并 → app.js），
             * 不能再直接引 data.js / app.js，否则实时层被绕过。 */
            if (!/src="boot\.js"/.test(idx)) { console.error("FAIL: index.html 没有引 boot.js"); bad++; }
            if (/src="app\.js"/.test(idx)) { console.error("FAIL: index.html 直接引了 app.js，会绕过实时层"); bad++; }
            if (/src="data\.js"/.test(idx)) { console.error("FAIL: index.html 直接引了 data.js，会绕过实时层"); bad++; }
            if (!fs.existsSync("boot.js")) { console.error("FAIL: 缺 boot.js"); bad++; }
            const boot = fs.readFileSync("boot.js", "utf8");
            if (!/webapi\.sporttery\.cn/.test(boot)) { console.error("FAIL: boot.js 没接体彩官方接口"); bad++; }
            if (!/__REFRESH_LIVE/.test(boot)) { console.error("FAIL: boot.js 没暴露 __REFRESH_LIVE"); bad++; }
            if (!/live-updated/.test(boot)) { console.error("FAIL: boot.js 没广播 live-updated 事件"); bad++; }
            if (bad) process.exit(1);
            console.log("OK PWA 资源完整，manifest name=" + mf.name);
          '

      - name: 数据完整性
        run: node scripts/verify-data.js

      - name: 部署脚本语法
        run: bash -n deploy/install.sh && echo "OK deploy/install.sh"

      - name: 启动服务并冒烟
        run: |
          node server.js &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/api/status > /dev/null; then break; fi
            sleep 0.5
          done

          echo "--- /api/status ---"
          curl -s http://127.0.0.1:8765/api/status | head -c 300; echo

          echo "--- index.html ---"
          curl -s -o /tmp/idx.html -w "status=%{http_code} bytes=%{size_download}\n" http://127.0.0.1:8765/

          echo "--- 静态资源 ---"
          for p in boot.js app.js style.css data.js; do
            curl -s -o /dev/null -w "$p status=%{http_code}\n" "http://127.0.0.1:8765/$p"
          done

          echo "--- 敏感路径必须 404 ---"
          for p in users/13800138000.json keys.json .env; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8765/$p")
            echo "$p -> $code"
            test "$code" = "404" || { echo "FAIL: $p 应返回 404，实际 $code"; kill $SRV; exit 1; }
          done

          echo "--- 未登录访问 /api/data 必须 401 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/api/data)
          echo "GET /api/data -> $code"
          test "$code" = "401" || { echo "FAIL: 未登录应 401，实际 $code"; kill $SRV; exit 1; }

          kill $SRV
          echo "冒烟通过"
